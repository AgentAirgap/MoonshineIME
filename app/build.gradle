plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    aaptOptions {
        noCompress 'onnx'
    }
    namespace 'com.whispertflite'
    compileSdk 35

    lint {
        disable += 'MissingTranslation'
    }

    defaultConfig {
        applicationId "org.woheller69.whisper"
        minSdk 28
        targetSdk 35
        versionCode 40
        versionName "4.0" // bumped from 3.10 for the dual-flavor release
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    flavorDimensions "device"

    productFlavors {
        catS22 {
            dimension "device"
            ndk {
                abiFilters "armeabi-v7a"
            }
            buildConfigField "boolean", "IS_SMARTPHONE", "false"
            buildConfigField "String", "MODEL_VARIANT", '"v1_tiny"'
        }

        smartphone {
            dimension "device"
            ndk {
                abiFilters "arm64-v8a"
            }
            buildConfigField "boolean", "IS_SMARTPHONE", "true"
            // Change to '"v1_base"' if you prefer the 5-file Moonshine v1 Base drop-in
            buildConfigField "String", "MODEL_VARIANT", '"v2_medium"'
        }
    }

    signingConfigs {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
